# Render Blueprint: deploy app bằng Docker. Database dùng Neon (đặt DATABASE_URL ở phần env bên dưới).
services:
  - type: web
    name: semsearch
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY         # dán key Gemini (nhiều key cách nhau dấu phẩy)
        sync: false
      - key: DATABASE_URL           # chuỗi kết nối Neon, dạng ...neon.tech/db?sslmode=require (dùng endpoint TRỰC TIẾP, không phải -pooler)
        sync: false
      - key: SEED_ACCOUNT_EMAIL
        value: giangnh@vihatgroup.com
      - key: SEED_ACCOUNT_PASSWORD  # đặt mật khẩu mạnh
        sync: false
      - key: SEED_ACCOUNT_NAME
        value: Giang Nguyen
      - key: SEED_ACCOUNT_PHONE
        value: "0357778534"
      - key: GEMINI_LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_RERANK_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: GEMINI_THINKING_LEVEL
        value: minimal
      - key: SEARCH_DEADLINE_MS
        value: "1800"
