<style>

.menu a.cur{background:var(--brand-soft);color:var(--brand);font-weight:600}.menu a.cur.hl{box-shadow:inset 0 0 0 1.5px var(--brand)}

.menu .n{color:var(--ink-3);font-size:12px;white-space:nowrap;background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:1px 8px}.menu a.cur .n{color:var(--brand);border-color:transparent}
.menu .mempty{padding:16px 12px;color:var(--ink-3);font-size:13px;text-align:center}
.menu .sep{height:1px;background:var(--line);margin:6px 4px;flex:none}.menu .add{color:var(--brand);font-weight:600;flex:none}
.spacer{flex:1}.iconbtn{display:grid;place-items:center;background:transparent;border:1px solid var(--line);border-radius:8px;width:44px;height:44px;color:var(--ink-2);flex:none}.iconbtn:hover{background:var(--sunken);color:var(--ink)}
.connection{position:relative}.connection>summary{list-style:none;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);padding:9px 12px;border:1px solid var(--line);border-radius:8px;min-height:44px;cursor:pointer}.connection summary::-webkit-details-marker{display:none}.connection[open]>summary{background:var(--sunken)}
.keys{position:absolute;right:0;top:calc(100% + 10px);width:300px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,50,35,.12);display:grid;gap:12px;z-index:40}.keys h2{font-size:14px;margin:0}.keys input{font-size:13px}
.wrap{margin-left:224px;padding:36px 36px 64px;max-width:calc(1440px + 224px)}
.phead{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:0 0 28px}.page-heading{display:flex;flex-direction:column;gap:5px}.phead h1{font-size:26px;font-weight:700;letter-spacing:-.9px;line-height:1.3;margin:0}.table-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3)}.phead .slug{font-size:12px}.stats{display:flex;gap:0;margin-left:auto}.stat{padding:0 18px;border-left:1px solid var(--line);text-align:left}.stat b{display:block;font-size:20px;font-weight:600;line-height:1.25;letter-spacing:-.4px;font-variant-numeric:tabular-nums}.stat span{display:block;font-size:12px;margin-top:4px;color:var(--ink-3)}.stat.warn b{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);min-width:0}.panel h2{font-size:16px;font-weight:600;margin:0 0 10px;letter-spacing:-.25px}.panel>p.lede{margin:0 0 20px;color:var(--ink-2);font-size:13px;max-width:72ch}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field>span{font-size:12px;color:var(--ink-2);font-weight:500}
input[type=text],input[type=email],input[type=search],input[type=number],input[type=password],input:not([type]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;min-width:0;min-height:44px}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.file-pick{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:1px dashed var(--ink-3);border-radius:8px;background:var(--sunken);cursor:pointer;font-size:13px;overflow:hidden}.file-pick .ico{color:var(--brand)}.file-pick input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;cursor:pointer}.file-pick:focus-within{outline:3px solid var(--brand);outline-offset:2px}.file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn:hover{background:var(--sunken);border-color:var(--ink-3)}.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}.btn.primary:hover{filter:brightness(.94)}.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}.btn.danger:hover{background:var(--bad-soft)}.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}.btn.ghost:hover{background:var(--sunken)}.btn:disabled{opacity:.5}.btn.sm{padding:7px 11px;font-size:12px;min-height:40px}

.pill{display:inline-block;border-radius:5px;padding:3px 8px;font-size:11px;font-weight:500;white-space:nowrap}.pill.read{background:var(--brand-soft);color:var(--brand)}.pill.write{background:var(--warn-soft);color:var(--warn)}.pill.on{background:var(--ok-soft);color:var(--ok)}.pill.off{background:var(--bad-soft);color:var(--bad)}
.empty{padding:36px 14px;text-align:center;color:var(--ink-3);font-size:13px}.empty b{display:block;color:var(--ink);font-size:15px;font-weight:500;margin-bottom:6px}[hidden]{display:none!important}.hidden{display:none!important}.banner{display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:20px}.banner .k{font-family:var(--mono);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;flex:1;word-break:break-all}
.search-panel{padding:28px;border-color:color-mix(in srgb,var(--brand) 32%,var(--line))}.search-title{display:flex;align-items:center;gap:9px;margin-bottom:18px;font-size:15px;font-weight:600}.search-title .ico{color:var(--brand)}
.utter{display:flex;gap:10px}.utter input{font-size:16px;padding:15px 16px;min-height:58px;background:var(--canvas);flex:1}.utter .btn.primary{padding:0 22px;min-height:58px}.utter-opts{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-top:16px;font-size:12px;color:var(--ink-2)}.utter-opts>label{display:flex;align-items:center;gap:8px}.utter-opts select{width:auto;font-size:12px;padding:6px 10px;min-height:38px}.shortcut{margin-left:auto;color:var(--ink-3);font-size:11px}kbd{font:11px var(--sans);border:1px solid var(--line);background:var(--sunken);padding:3px 6px;border-radius:4px}
.ctx{margin-top:16px;padding:10px 12px;background:var(--sunken);border-radius:8px;font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.query-start{padding:22px 4px}.query-start h2{font-size:13px;color:var(--ink-2);font-weight:500;margin:0 0 16px}.example-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.example{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);border-radius:10px;background:transparent;padding:16px 18px;font-size:13px;font-weight:400;min-height:80px;color:var(--ink-2)}.example:hover{background:var(--surface);border-color:var(--brand);color:var(--brand)}.example .ico{width:17px;height:17px;color:var(--brand)}.start-note{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);margin-top:24px}.start-note .ico{width:16px;height:16px}

.flags{margin:10px 0}.flag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:5px;margin:4px 5px 0 0}.flag.warn{background:var(--warn-soft);color:var(--warn)}.flag.info{background:var(--brand-soft);color:var(--brand)}.flag.bad{background:var(--bad-soft);color:var(--bad)}
.results{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}.record h3{font-size:21px;line-height:1.4;margin:0 0 5px;font-weight:600;letter-spacing:-.5px}.record .sub{color:var(--ink-3);font-size:12px;margin-bottom:16px}.record .reason{background:var(--sunken);border-radius:8px;padding:12px 14px;margin:0 0 20px;font-size:13px}.record .reason b{color:var(--ink-3);font-weight:500}dl.kv{display:grid;grid-template-columns:minmax(90px,max-content) minmax(0,1fr);gap:10px 20px;margin:0;font-size:13px}dl.kv dt{color:var(--ink-3)}dl.kv dd{margin:0;overflow-wrap:anywhere}.conf{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:12px;color:var(--ink-2)}.meter{flex:1;max-width:160px;height:5px;background:var(--line-2);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--brand);border-radius:4px}.alternatives{border-left:1px solid var(--line);padding-left:24px}.alts{list-style:none;margin:0;padding:0}.alts li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:12px}.alts li:last-child{border-bottom:0}.alts .s{color:var(--ink-3);font-variant-numeric:tabular-nums}
.fb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:12px}.fb input{width:160px;font-size:12px}.feedback-extra{margin-top:12px}.feedback-extra>summary{font-size:12px;color:var(--ink-3);cursor:pointer}.feedback-extra .actions{margin-top:12px}.feedback-extra input:not([type=checkbox]){max-width:180px}input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);margin:0 6px 0 0;vertical-align:-3px}

function apiCols(n){ const t = T(); return (t.columns.length ? t.columns : [tr("row_code"), tr("row_name")]).slice(0, n); }
function apiCode(){
  const op = API_OPS.find(o => o.k === API.op), u = `${location.origin}/v1/tables/${T().slug}${op.p}`;
  const key = $("#realkeys")?.checked && $("#apikey").value ? $("#apikey").value : tr(op.w ? "key_write_ph" : "key_read_ph");
  const q = tr("curl_example_q"), J = v => JSON.stringify(v), P = (v, ind, sp = 2) => JSON.stringify(v, null, sp).replace(/\n/g, "\n" + " ".repeat(ind));
  const params = {text: q, top_k: String(API.top_k), mode: API.mode};
  const body = op.k === "ask" ? {text: q, top_k: API.top_k, mode: API.mode}
    : op.k === "upsert" ? {rows: [Object.fromEntries(apiCols(4).map(c => [c, "…"]))], mode: API.wmode}
    : {keys: ["MA_1", "MA_2"]};
  const get = op.m === "GET";
  if (API.lang === "curl") return get
    ? [`curl -G '${u}'`, `  -H 'X-API-Key: ${key}'`, ...Object.entries(params).map(([k, v]) => `  --data-urlencode '${k}=${v}'`)].join(" \\\n")
    : [`curl -X ${op.m} '${u}'`, `  -H 'Content-Type: application/json'`, `  -H 'X-API-Key: ${key}'`, `  -d '${J(body)}'`].join(" \\\n");
  if (API.lang === "js") return get
    ? [`const params = new URLSearchParams(${P(params, 0)});`, ``, 'const res = await fetch(`' + u + '?${params}`, {', `  headers: { "X-API-Key": ${J(key)} },`, `});`, `const data = await res.json();`].join("\n")
    : [`const res = await fetch(${J(u)}, {`, `  method: ${J(op.m)},`, `  headers: {`, `    "Content-Type": "application/json",`, `    "X-API-Key": ${J(key)},`, `  },`, `  body: JSON.stringify(${P(body, 2)}),`, `});`, `const data = await res.json();`].join("\n");
  return [`import requests`, ``, `res = requests.${op.m.toLowerCase()}(`, `    ${J(u)},`, `    headers={"X-API-Key": ${J(key)}},`,
    get ? `    params=${P(params, 4, 4)},` : `    json=${P(body, 4, 4)},`, `    timeout=10,`, `)`, `data = res.json()`].join("\n");
}
function apiResp(k){
  const v = T().data_version + 1, row = Object.fromEntries(apiCols(6).map(c => [c, "…"]));
  if (k === "upsert") return {upserted: 1, row_keys: ["MA_1"], data_version: v, embed_job: "…", warnings: []};
  if (k === "delete") return {deleted: 2, data_version: v};
  return {found: true, status: "matched", row, rows: [row], count: 1, score: 0.89, row_key: "…", clarify_question: null,
          alternatives: [{row_key: "…", name: "…", score: 0.53}], request_id: "…", latency_ms: 640};
}
function hlCode(code){
  const re = /("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`|\b(?:const|await|new|import|return|True|False|None|null|true|false)\b|(?<![\w-])-{1,2}[A-Za-z][\w-]*|\b\d+(?:\.\d+)?\b)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    const tok = m[0], c = tok[0];
    const cls = `"'\``.includes(c) ? (/^\s*:/.test(code.slice(re.lastIndex)) ? "k" : "s") : c === "-" ? "f" : /\d/.test(c) ? "n" : "w";
    out += esc(code.slice(last, m.index)) + `<span class="tk-${cls}">${esc(tok)}</span>`; last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
window.copyText = async (txt, b) => {

  catch { b.textContent = tr("err_short"); }
  b._copyTimer = setTimeout(() => { if (b.isConnected) b.textContent = original; }, 1500);
};

      const you = a.id === meId ? ` <span class="muted">${tr('ac_you')}</span>` : "";
      const av = a.avatar_url
        ? `<img class="av" src="${esc(a.avatar_url)}" alt="" width="40" height="40" referrerpolicy="no-referrer">`
        : `<span class="av">${esc((a.name || a.email || "?").trim()[0].toUpperCase())}</span>`;
      return `<div class="acct-row">
        <div class="acct-id">${av}<div class="acct-main">
          <b>${esc(a.name || a.email)}</b>
          <span class="acct-email">${esc(a.email)}${you}</span>
          <div class="acct-tags">
            ${a.is_admin ? `<span class="badge ad">${tr('role_admin')}</span>` : `<span class="badge usr">${tr('role_user')}</span>`}
            ${a.active ? `<span class="badge ok">${tr('status_active')}</span>` : `<span class="badge off">${tr('status_disabled')}</span>`}
            ${a.via_google ? `<span class="badge g">Google</span>` : ""}
            <span class="acct-meta">${a.phone ? esc(a.phone) + " · " : ""}${a.n_tables} ${tr('ac_tables').toLowerCase()}</span>
          </div>
        </div></div>
        <div class="acct-actions">
          <button class="btn ghost sm" onclick='editAccount(${a.id})'>${tr('ac_edit')}</button>
          <button class="btn ghost sm" onclick='resetPass(${a.id},"${esc(a.email)}")'>${tr('ac_resetpw')}</button>
          ${a.id === meId ? "" : `<button class="btn ghost sm" onclick='toggleActive(${a.id},${!a.active})'>${a.active ? tr("ac_disable") : tr("ac_enable")}</button>
          <button class="btn ghost sm danger" onclick='delAccount(${a.id},"${esc(a.email)}")'>${tr('ac_delete')}</button>`}
        </div>
      </div>`;
    }).join("");
    $("#acctcreate").innerHTML = `<h3>${tr('add_account')}</h3>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        <label class="field"><span>${tr('ac_email')}</span><input id="naEmail" type="email" placeholder="${tr('acc_email_ph')}"></label>
        <label class="field"><span>${tr('acc_pass')}</span><input id="naPass" type="text" placeholder="${tr('acc_pass_ph')}"></label>
        <label class="field"><span>${tr('acc_name')}</span><input id="naName" placeholder="${tr('acc_name_ph')}"></label>
        <label class="field"><span>${tr('acc_phone')}</span><input id="naPhone" placeholder="${tr('acc_phone_ph')}"></label></div>
      <div class="actions" style="margin-top:12px"><label style="display:flex;gap:7px;align-items:center;font-size:14px"><input type="checkbox" id="naAdmin"> ${tr('acc_admin_role')}</label>
        <span class="spacer"></span><button class="btn primary" onclick="createAccount()">${tr('create_account_btn')}</button></div>`;
  } catch (e) { $("#acctlist").innerHTML = `<p class="msg err">${esc(e.message)}</p>`; }
}
window.createAccount = async () => {
  const body = {email: $("#naEmail").value.trim(), password: $("#naPass").value, name: $("#naName").value.trim() || null,
                phone: $("#naPhone").value.trim() || null, is_admin: $("#naAdmin").checked};
  if (!body.email || body.password.length < 6) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = tr("enter_email_pass"); return; }
  try { await req("/v1/admin/accounts", {method: "POST", body: JSON.stringify(body)}); $("#acctmsg").className = "msg ok"; $("#acctmsg").textContent = tr("created_prefix") + body.email; await loadAccounts(); }
  catch (e) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = e.message; }
};
window.editAccount = async id => {
  const name = prompt(tr("prompt_name")); if (name === null) return;
  const phone = prompt(tr("prompt_phone")); if (phone === null) return;
  const data = {}; if (name.trim()) data.name = name.trim(); if (phone.trim()) data.phone = phone.trim();
  if (!Object.keys(data).length) return;
  try { await req(`/v1/admin/accounts/${id}`, {method: "PATCH", body: JSON.stringify(data)}); await loadAccounts(); } catch (e) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = e.message; }
};
window.resetPass = async (id, email) => {
  const pw = prompt(tr("reset_pw_prompt").replace("{email}", email)); if (!pw) return;
  if (pw.length < 6) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = tr("pw_min6"); return; }
  try { await req(`/v1/admin/accounts/${id}`, {method: "PATCH", body: JSON.stringify({password: pw})}); $("#acctmsg").className = "msg ok"; $("#acctmsg").textContent = tr("pw_changed"); } catch (e) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = e.message; }
};
window.toggleActive = async (id, active) => {
  try { await req(`/v1/admin/accounts/${id}`, {method: "PATCH", body: JSON.stringify({active})}); await loadAccounts(); } catch (e) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = e.message; }
};
window.delAccount = async (id, email) => {
  if (!confirm(tr("del_acct_confirm").replace("{email}", email))) return;
  try { await req(`/v1/admin/accounts/${id}`, {method: "DELETE"}); await loadAccounts(); } catch (e) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = e.message; }
};
// ---------- đăng nhập Google ----------
async function onGoogleCredential(resp){
  const remember = $("#loginRemember") ? $("#loginRemember").checked : true;
  if ($("#loginErr")) $("#loginErr").textContent = "";
  try {
    const r = await fetch("/v1/auth/google", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({credential: resp.credential, remember})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || (LANG === "en" ? "Google sign-in failed" : "Đăng nhập Google thất bại"));
    saveAuth(j.token, remember); AUTH.account = j.account;
    hideLogin(); renderAccount(); route();
  } catch (err) { if ($("#loginErr")) $("#loginErr").textContent = err.message; }
}
let GOOGLE_READY = false, GOOGLE_CID = "";
function renderGoogleBtn(){
  if (!GOOGLE_READY) return; const box = $("#gbtn"); if (!box) return; box.innerHTML = "";
  google.accounts.id.renderButton(box, {theme: "outline", size: "large", width: 324,
    text: "continue_with", locale: LANG === "en" ? "en" : "vi"});
}
async function initGoogle(){
  if (GOOGLE_READY) return;
  let cfg; try { cfg = await (await fetch("/v1/auth/config")).json(); } catch { return; }
  if (!cfg.google_enabled || !cfg.google_client_id) return;
  for (let i = 0; i < 50 && !(window.google && google.accounts && google.accounts.id); i++) await sleep(100);
  if (!(window.google && google.accounts && google.accounts.id)) return;
  GOOGLE_CID = cfg.google_client_id;
  google.accounts.id.initialize({client_id: GOOGLE_CID, callback: onGoogleCredential});
  GOOGLE_READY = true; renderGoogleBtn();
  $("#authdiv").hidden = false; $("#gbtn").hidden = false;
}
async function boot(){
  initGoogle();
  try {
    const r = await fetch("/v1/auth/me", {headers: AUTH.token ? {Authorization: "Bearer " + AUTH.token} : {}});
    if (r.status === 401) { showLogin(); return; }
    const j = await r.json(); AUTH.account = j.account || null;
  } catch { /* server lỗi -> vẫn thử vào app */ }
  hideLogin(); renderAccount(); route();
}
boot();
</script>
