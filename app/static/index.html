<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semsearch Console</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{

  color-scheme:dark;--canvas:#14221d;--surface:#1b2c25;--sunken:#22362c;--rail:#182820;
  --ink:#edf3ee;--ink-2:#bacbc0;--ink-3:#9aafa1;--line:#344b3d;--line-2:#2c4034;
  --brand:#a7d7b8;--brand-ink:#163b28;--brand-soft:#2a4836;
  --ok:#a7d7b8;--ok-soft:#264432;--warn:#efd094;--warn-soft:#493d24;--bad:#ffb0a8;--bad-soft:#4b302b;
  --lane-emb:#8abfa2;--lane-und:#aaa0d5;--lane-ret:#809a89;--lane-rr:#d0ae6b;
}}
:root[data-theme="dark"]{
  color-scheme:dark;--canvas:#14221d;--surface:#1b2c25;--sunken:#22362c;--rail:#182820;
  --ink:#edf3ee;--ink-2:#bacbc0;--ink-3:#9aafa1;--line:#344b3d;--line-2:#2c4034;
  --brand:#a7d7b8;--brand-ink:#163b28;--brand-soft:#2a4836;
  --ok:#a7d7b8;--ok-soft:#264432;--warn:#efd094;--warn-soft:#493d24;--bad:#ffb0a8;--bad-soft:#4b302b;
  --lane-emb:#8abfa2;--lane-und:#aaa0d5;--lane-ret:#809a89;--lane-rr:#d0ae6b;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--canvas);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button,a,label.btn,summary{touch-action:manipulation}
button,a,summary{ -webkit-tap-highlight-color:transparent }
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:1px}
button{cursor:pointer}button:disabled{cursor:default}
code,pre,.mono{font:12.5px/1.6 var(--mono)}
.ico{width:20px;height:20px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.skip-link{position:fixed;left:16px;top:-80px;background:var(--brand);color:var(--brand-ink);padding:10px 16px;z-index:100;border-radius:8px}.skip-link:focus{top:16px}
.sidebar{position:fixed;inset:0 auto 0 0;width:224px;background:var(--rail);border-right:1px solid var(--line);padding:28px 16px 18px;display:flex;flex-direction:column;z-index:35}
.logo{display:flex;align-items:center;gap:10px;font-size:21px;letter-spacing:-.8px;font-weight:700;color:var(--ink);text-decoration:none;padding:0 10px 28px}
.logo .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--brand);color:var(--brand-ink)}
.logomark{flex:none;object-fit:contain;background:#fff;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(16,32,64,.08)}
.logo .logomark{width:34px;height:34px}
.authcard .brand .logomark{width:44px;height:44px;border-radius:12px}
.logo .mark .ico{width:23px;height:23px}
.rail-label{color:var(--ink-3);font-size:12px;padding:0 12px;margin:12px 0 8px}
.tabs{display:flex;flex-direction:column;gap:5px;margin:0}

.tabs a:hover{background:var(--surface);color:var(--ink)}
.tabs a.on{background:var(--surface);color:var(--brand);font-weight:700;box-shadow:0 2px 5px rgba(20,60,40,.04)}
.nav-break{height:1px;background:var(--line);margin:12px 12px}
.rail-bottom{margin-top:auto;padding-top:24px}

.rail-add:hover{border-color:var(--brand)}
.rail-foot{display:flex;align-items:center;justify-content:space-between;padding:18px 10px 0;color:var(--ink-3);font-size:12px}
.appbar{margin-left:224px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:30}
.appbar-in{max-width:1440px;margin:auto;display:flex;align-items:center;gap:16px;padding:14px 36px;min-height:73px}
.crumb{color:var(--ink-3);font-size:12px}.crumb .ico{width:16px;height:16px;margin-right:6px}
.picker{position:relative}.picker>button{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 9px;min-height:42px;max-width:320px;text-align:left;cursor:pointer;transition:border-color .12s,box-shadow .12s,background .12s}
.picker>button:hover{border-color:var(--ink-3);background:var(--sunken)}
.picker>button[aria-expanded=true]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.picker .pico{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:7px;background:var(--brand-soft);color:var(--brand)}
.picker .pico svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.picker>button b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.picker .pcount{flex:none;font-size:11px;color:var(--ink-3);background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.caret{color:var(--ink-3);flex:none;transition:transform .15s}.picker>button[aria-expanded=true] .caret{transform:rotate(180deg)}
.menu{position:absolute;top:calc(100% + 6px);left:0;width:328px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(20,50,35,.16);padding:6px;display:none}
.menu.open{display:flex;flex-direction:column;max-height:min(72vh,520px)}
.msearch{padding:4px 4px 6px;flex:none}
.sbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;background:var(--sunken);padding:0 10px}
.sbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);background:var(--surface)}
.sbox svg{flex:none;width:16px;height:16px;color:var(--ink-3);fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sbox input{flex:1;min-width:0;border:0;background:none;padding:9px 0;font-size:13.5px}
.sbox input:focus{outline:none;box-shadow:none}
.mlist{overflow:auto;flex:1;min-height:0}
.menu a,.menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:42px;text-align:left;background:none;border:0;border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--ink);text-decoration:none;font-size:13.5px;scroll-margin:6px}
.menu a:hover,.menu button:hover,.menu a.hl{background:var(--sunken)}
.menu a.cur{background:var(--brand-soft);color:var(--brand);font-weight:600}.menu a.cur.hl{box-shadow:inset 0 0 0 1.5px var(--brand)}
.menu a .nm{display:flex;align-items:center;gap:9px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu a .nm .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none;opacity:0}.menu a.cur .nm .dot{opacity:1}
.menu .n{color:var(--ink-3);font-size:12px;white-space:nowrap;background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:1px 8px}.menu a.cur .n{color:var(--brand);border-color:transparent}
.menu .mempty{padding:16px 12px;color:var(--ink-3);font-size:13px;text-align:center}
.menu .sep{height:1px;background:var(--line);margin:6px 4px;flex:none}.menu .add{color:var(--brand);font-weight:600;flex:none}
.spacer{flex:1}.iconbtn{display:grid;place-items:center;background:transparent;border:1px solid var(--line);border-radius:8px;width:44px;height:44px;color:var(--ink-2);flex:none}.iconbtn:hover{background:var(--sunken);color:var(--ink)}
.connection{position:relative}.connection>summary{list-style:none;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);padding:9px 12px;border:1px solid var(--line);border-radius:8px;min-height:44px;cursor:pointer}.connection summary::-webkit-details-marker{display:none}.connection[open]>summary{background:var(--sunken)}
.keys{position:absolute;right:0;top:calc(100% + 10px);width:300px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,50,35,.12);display:grid;gap:12px;z-index:40}.keys h2{font-size:14px;margin:0}.keys input{font-size:13px}
.wrap{margin-left:224px;padding:36px 36px 64px;max-width:calc(1440px + 224px)}
.phead{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:0 0 28px}.page-heading{display:flex;flex-direction:column;gap:5px}.phead h1{font-size:26px;font-weight:700;letter-spacing:-.9px;line-height:1.3;margin:0}.table-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3)}.phead .slug{font-size:12px}.stats{display:flex;gap:0;margin-left:auto}.stat{padding:0 18px;border-left:1px solid var(--line);text-align:left}.stat b{display:block;font-size:20px;font-weight:600;line-height:1.25;letter-spacing:-.4px;font-variant-numeric:tabular-nums}.stat span{display:block;font-size:12px;margin-top:4px;color:var(--ink-3)}.stat.warn b{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);min-width:0}.panel h2{font-size:16px;font-weight:600;margin:0 0 10px;letter-spacing:-.25px}.panel>p.lede{margin:0 0 20px;color:var(--ink-2);font-size:13px;max-width:72ch}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field>span{font-size:12px;color:var(--ink-2);font-weight:500}
input[type=text],input[type=search],input[type=number],input[type=password],input:not([type]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;min-width:0;min-height:44px}
input::placeholder,textarea::placeholder{color:var(--ink-3);opacity:1}input:focus,select:focus,textarea:focus{border-color:var(--brand)}
.secret-field{position:relative;display:block;min-width:0}.secret-field input{padding-right:54px}.secret-toggle{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:44px;min-height:44px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:var(--ink-2)}.secret-toggle:hover{background:var(--brand-soft);color:var(--brand)}.key-secret{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.key-secret>.secret-field{flex:1;min-width:min(240px,100%)}.key-secret input{font-family:var(--mono);font-size:12px}.key-secret .btn{min-height:44px}.key-secret-note{margin:8px 0 0;color:var(--ink-3);font-size:12px}
input[type=file]{max-width:100%;font-size:13px;padding:8px;background:var(--sunken);border-radius:8px}input[type=file]::file-selector-button{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:8px 12px;color:var(--ink);margin-right:10px;font:inherit;cursor:pointer}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.file-pick{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:1px dashed var(--ink-3);border-radius:8px;background:var(--sunken);cursor:pointer;font-size:13px;overflow:hidden}.file-pick .ico{color:var(--brand)}.file-pick input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;cursor:pointer}.file-pick:focus-within{outline:3px solid var(--brand);outline-offset:2px}.file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 15px;min-height:44px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunken);border-color:var(--ink-3)}.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}.btn.primary:hover{filter:brightness(.94)}.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}.btn.danger:hover{background:var(--bad-soft)}.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}.btn.ghost:hover{background:var(--sunken)}.btn:disabled{opacity:.5}.btn.sm{padding:7px 11px;font-size:12px;min-height:40px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.actions label:has(select){display:inline-flex;gap:8px;align-items:center}.muted{color:var(--ink-3)}.small{font-size:12px}.msg{font-size:13px;color:var(--ink-2)}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}.msg:empty{display:none}#job:not(:empty){padding:12px 16px;background:var(--sunken);border-radius:8px;margin-bottom:18px}
pre{background:var(--sunken);border:1px solid var(--line-2);border-radius:var(--r);padding:16px;margin:0;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px}table.data th{text-align:left;font-weight:500;color:var(--ink-2);padding:13px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--sunken);z-index:1}table.data td{padding:13px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}table.data tr:last-child td{border-bottom:0}table.data tr:hover td{background:var(--sunken)}.num{text-align:right!important;font-variant-numeric:tabular-nums}.scroll{overflow:auto;max-width:100%;overscroll-behavior-x:contain}.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12px;margin:3px 5px 3px 0;color:var(--ink-2);background:var(--sunken)}
.pill{display:inline-block;border-radius:5px;padding:3px 8px;font-size:11px;font-weight:500;white-space:nowrap}.pill.read{background:var(--brand-soft);color:var(--brand)}.pill.write{background:var(--warn-soft);color:var(--warn)}.pill.on{background:var(--ok-soft);color:var(--ok)}.pill.off{background:var(--bad-soft);color:var(--bad)}
.empty{padding:36px 14px;text-align:center;color:var(--ink-3);font-size:13px}.empty b{display:block;color:var(--ink);font-size:15px;font-weight:500;margin-bottom:6px}.hidden{display:none!important}.banner{display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:20px}.banner .k{font-family:var(--mono);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;flex:1;word-break:break-all}
.search-panel{padding:28px;border-color:color-mix(in srgb,var(--brand) 32%,var(--line))}.search-title{display:flex;align-items:center;gap:9px;margin-bottom:18px;font-size:15px;font-weight:600}.search-title .ico{color:var(--brand)}
.utter{display:flex;gap:10px}.utter input{font-size:16px;padding:15px 16px;min-height:58px;background:var(--canvas);flex:1}.utter .btn.primary{padding:0 22px;min-height:58px}.utter-opts{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-top:16px;font-size:12px;color:var(--ink-2)}.utter-opts>label{display:flex;align-items:center;gap:8px}.utter-opts select{width:auto;font-size:12px;padding:6px 10px;min-height:38px}.shortcut{margin-left:auto;color:var(--ink-3);font-size:11px}kbd{font:11px var(--sans);border:1px solid var(--line);background:var(--sunken);padding:3px 6px;border-radius:4px}
.ctx{margin-top:16px;padding:10px 12px;background:var(--sunken);border-radius:8px;font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.query-start{padding:22px 4px}.query-start h2{font-size:13px;color:var(--ink-2);font-weight:500;margin:0 0 16px}.example-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.example{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);border-radius:10px;background:transparent;padding:16px 18px;font-size:13px;font-weight:400;min-height:80px;color:var(--ink-2)}.example:hover{background:var(--surface);border-color:var(--brand);color:var(--brand)}.example .ico{width:17px;height:17px;color:var(--brand)}.start-note{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);margin-top:24px}.start-note .ico{width:16px;height:16px}
.verdict{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 15px;border-radius:8px;margin:0 0 24px;font-weight:500}.verdict.matched{background:var(--ok-soft);color:var(--ok)}.verdict.ambiguous{background:var(--warn-soft);color:var(--warn)}.verdict.no_match,.verdict.out_of_scope{background:var(--bad-soft);color:var(--bad)}.verdict .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}.verdict .what{font-size:13px;font-weight:600}.verdict .ask{color:var(--ink);font-size:13px;font-weight:400;flex-basis:100%;margin:0}.verdict .ask b{color:var(--ink-2);font-weight:500}.result-time{margin-left:auto;font-size:12px;color:var(--ink-2)}
.flags{margin:10px 0}.flag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:5px;margin:4px 5px 0 0}.flag.warn{background:var(--warn-soft);color:var(--warn)}.flag.info{background:var(--brand-soft);color:var(--brand)}.flag.bad{background:var(--bad-soft);color:var(--bad)}

function renderPicker(){

function pickHl(dir){

function go(h){ if (location.hash === h) route(); else location.hash = h; }

  if (nextSlug && nextSlug !== S.slug) { S.ctx = null; S.last = null; }

async function watchJob(id){
  const el = $("#job"); if (!el) return;
  const j = await pollJob(id, j => { if ($("#job")) $("#job").textContent = `${JOB_NAMES[j.kind] || j.kind}… ${Math.round(j.progress)}%`; });
  if (!$("#job")) return;
  $("#job").className = "msg " + (j.status === "done" ? "ok" : "err");
  $("#job").textContent = j.status === "done" ? (j.kind === "embed" ? `Đã tạo vector: ${j.result.embedded} mới, ${j.result.reused} giữ nguyên.` : "Hoàn tất.") : `Lỗi: ${j.error}`;

async function doTry(){
  const text = $('#q').value.trim(); if (!text || $('#uform button').disabled) return;
  const slug = S.slug, output = $('#tryout'), button = $('#uform button');
  const body = {text, mode: $('#mode').value, top_k: +$('#topk').value, debug: true};
  if (S.ctx) body.context = {previous_text: S.ctx.previous_text, previous_product_ids: S.ctx.ids, previous_filters: S.ctx.filters};
  button.disabled = true; button.textContent = 'Đang tìm…'; output.setAttribute('aria-busy','true');
  output.innerHTML = `<div class="panel"><p class="msg">Đang tìm kết quả…</p></div>`;
  try { const r = await req(`/v1/demos/${encodeURIComponent(slug)}/search`, {method:'POST',body:JSON.stringify(body)});
    if (S.slug !== slug || S.tab !== 'try' || $('#tryout') !== output) return;
    S.last = {...r, _text:text}; renderTry(r);
  } catch(e) { if ($('#tryout') === output) output.innerHTML = `<div class="panel"><p class="msg err" role="alert">${esc(e.message)}</p><button class="btn" onclick="doTry()">Thử lại</button></div>`; }

const VERDICT = {matched:'Tìm thấy kết quả', ambiguous:'Cần hỏi thêm', no_match:'Chưa có kết quả phù hợp', out_of_scope:'Câu hỏi ngoài phạm vi bảng'};

const FALLBACK = {understand_timeout: "hiểu câu quá thời gian", understand_error: "lỗi hiểu câu", understand_rate_limited: "hiểu câu bị giới hạn tốc độ",
  understand_deferred: "không chờ hiểu câu", understand_quota_exhausted: "hết quota hiểu câu", embed_timeout: "embedding quá thời gian", embed_error: "lỗi embedding",
  embed_rate_limited: "embedding bị giới hạn tốc độ", embed_quota_exhausted: "hết quota embedding", rerank_timeout: "rerank quá thời gian", rerank_error: "lỗi rerank",
  rerank_rate_limited: "rerank bị giới hạn tốc độ", rerank_quota_exhausted: "hết quota rerank"};
function timeline(L, reranked){
  const und = L.understand || 0, emb = L.embed || 0, ret = L.retrieve || 0, rr = L.rerank || 0;
  const par = Math.max(und, emb), total = Math.max(L.total || 0, par + ret + rr, 1), budget = reranked ? 1500 : 800, scale = Math.max(total, budget) * 1.08;
  const ms = v => Math.round(v).toLocaleString("vi-VN") + " ms";
  const seg = (start, dur, color, label) => { if (!dur) return `<div class="track"></div>`; const w = dur / scale * 100;
    return `<div class="track"><div class="seg ${w > 24 ? "inside" : ""}" style="left:${start / scale * 100}%;width:${Math.max(w, .6)}%;background:${color}"><span>${label}</span></div></div>`; };
  return `<div class="timeline"><div class="tl-head"><span class="small muted">Thời gian xử lý</span>
      <span class="total">${Math.round(L.total).toLocaleString("vi-VN")}<small>ms</small></span></div>
    <div class="lanes"><div class="lane"><span class="lb">Hiểu câu</span>${seg(0, und, "var(--lane-und)", ms(und))}</div>
      <div class="lane"><span class="lb">Embedding</span>${seg(0, emb, "var(--lane-emb)", ms(emb))}</div>
      <div class="lane"><span class="lb">Truy xuất</span>${seg(par, Math.max(ret, total * .004), "var(--lane-ret)", ms(ret))}</div>
      <div class="lane"><span class="lb">Rerank</span>${seg(par + ret, rr, "var(--lane-rr)", rr ? ms(rr) : "")}</div>
      <div class="budget" style="left:calc(92px + (100% - 92px) * ${budget / scale})"><i>mục tiêu ${budget} ms</i></div></div></div>`;
}
function rowOf(p){ return p.data && p.data.raw && Object.keys(p.data.raw).length ? p.data.raw : Object.fromEntries([["Mã", p.sku], ["Tên", p.name], ["Giá", p.price], ...p.attributes.map(a => [a.label, a.display])]); }
function kv(row, cols){ const keys = cols && cols.length ? [...cols.filter(c => c in row), ...Object.keys(row).filter(k => !cols.includes(k))] : Object.keys(row);
  return `<dl class="kv">${keys.map(k => `<dt>${esc(k)}</dt><dd>${row[k] == null || row[k] === "" ? '<span class="muted">–</span>' : esc(typeof row[k] === 'number' ? fmtNum(row[k]) : row[k])}</dd>`).join("")}</dl>`; }
function renderTry(r){
  const u = r.understanding, top = r.products[0], cols = T().columns, flags = [];
  if(r.cache_hit) flags.push(`<span class="flag info">Từ bộ nhớ đệm</span>`);
  if(r.reranked) flags.push(`<span class="flag info">Đã xếp hạng lại</span>`);
  if(r.relaxed) flags.push(`<span class="flag warn">Nới điều kiện: ${esc(r.relaxed_keys.join(', '))}</span>`);
  if(r.fallback_reason) r.fallback_reason.split(',').forEach(f => flags.push(`<span class="flag bad">${esc(FALLBACK[f] || f)}</span>`));
  let h = `<div class="panel"><div class="verdict ${r.status}"><span class="dot"></span><span class="what">${VERDICT[r.status]}</span><span class="result-time">${fmtNum(Math.round(r.latency_ms.total))} ms</span>${r.clarify_question ? `<span class="ask">${esc(r.clarify_question)}</span>` : ''}</div>`;
  if(top){ h += `<div class="results"><div class="record"><h3>${esc(top.name)}</h3><div class="sub">${esc(top.sku)}</div><div class="conf"><span>Điểm phù hợp ${pct(top.score)}</span><div class="meter"><i style="width:${Math.max(0,Math.min(100,Math.round(top.score*100)))}%"></i></div></div>${top.reason ? `<p class="reason">${esc(top.reason)}</p>` : ''}${kv(rowOf(top),cols)}</div><div class="alternatives"><h2>Kết quả khác</h2>${r.products.length > 1 ? `<ul class="alts">${r.products.slice(1).map(p => `<li><span>${esc(p.name)}</span><span class="s">${pct(p.score)}</span></li>`).join('')}</ul>` : '<p class="muted small">Không có kết quả khác.</p>'}</div></div>`; }
  else if(r.status !== 'out_of_scope') h += `<p class="muted small">Thử thêm tên, mã hoặc đặc điểm sản phẩm.</p>`;

  h += `<div class="fb"><span>Kết quả phù hợp?</span><button class="btn sm" onclick="feedback(true)">${icon('check')}Đúng</button><button class="btn sm" onclick="feedback(false)">Chưa đúng</button><span id="fbmsg" class="msg" role="status"></span><span class="spacer"></span>${top ? '<button class="btn sm" onclick="useAsCtx()">Hỏi tiếp</button>' : ''}</div><details class="feedback-extra"><summary>Bổ sung phản hồi</summary><div class="actions"><label class="field"><span>ID dòng đúng</span><input id="fbpid" type="number" min="1" placeholder="Tuỳ chọn"></label><label class="small"><input type="checkbox" id="fbeval">Lưu câu kiểm thử</label></div></details>`;
  h += `<details class="debug"><summary>Chi tiết xử lý</summary>${timeline(r.latency_ms,r.reranked)}${flags.length ? `<div class="flags">${flags.join('')}</div>` : ''}<div class="understanding"><dl class="kv"><dt>Ý định</dt><dd>${esc(u.intent)}</dd><dt>Câu tìm kiếm</dt><dd>${esc(u.rewritten_query || '–')}</dd><dt>Bộ lọc</dt><dd>${esc(describeFilters(u.filters)) || 'Không có'}</dd></dl></div>${r.debug ? `<details class="debug"><summary>Điểm ứng viên</summary><div class="scroll">${debugTable(r.debug.candidates)}</div></details><details class="debug"><summary>JSON phản hồi</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details>` : ''}</details>`;
  $('#tryout').innerHTML = h + '</div>';
}

function describeFilters(f){ if (!f) return ""; const out = []; const p = f.price;
  if (p) { if (p.approx) out.push(`giá khoảng ${fmtNum(p.approx)}`); if (p.min) out.push(`từ ${fmtNum(p.min)}`); if (p.max) out.push(`đến ${fmtNum(p.max)}`); if (p.sort) out.push(p.sort === "asc" ? "rẻ nhất" : "đắt nhất"); }
  if (f.category) out.push(f.category); if (f.brand) out.push(f.brand);
  (f.attributes || []).forEach(a => out.push(`${a.key} ${a.op} ${a.value}${a.value_max != null ? "–" + a.value_max : ""}${a.explicit ? "" : " (mong muốn)"}`)); return out.join("; "); }
function debugTable(cs){ const n = v => v == null ? "" : Number(v).toFixed(3);

    cs.map(c => `<tr><td>${c.product_id}</td><td>${esc(c.name)}</td><td class="num">${n(c.dense.cos_f32)}</td><td class="num">${n(c.bm25)}</td><td class="num">${n(c.entity)}</td><td class="num">${n(c.soft)}</td><td class="num">${n(c.rrf)}</td><td class="num">${n(c.final)}</td><td class="num">${n(c.rerank)}</td><td class="num"><b>${n(c.score)}</b></td></tr>`).join("") + `</table>`; }
window.useAsCtx = () => { const r = S.last; if (!r?.products[0]) return;
  S.ctx = {previous_text: r._text, ids: [r.products[0].product_id], names: [r.products[0].name], filters: r.understanding.filters};

window.feedback = async ok => { const r = S.last; if (!r) return; const pid = parseInt($("#fbpid").value);

    $("#fbmsg").className = "msg ok"; $("#fbmsg").textContent = j.eval_case ? "Đã lưu phản hồi và câu kiểm thử." : "Đã ghi nhận."; }

  try { const {job_id} = await req(`/v1/admin/demos/${encodeURIComponent(S.slug)}/enrich`, {method: "POST", body: JSON.stringify({dry_run: true, overwrite_fields: $("#ovw").checked ? ["aliases", "use_cases", "sample_questions"] : []})});
    S.enrichJob = job_id; const j = await watchJob(job_id); if (j?.status !== "done") return; const props = j.result.proposals; const FN = {aliases: "Tên gọi khác", use_cases: "Công dụng", sample_questions: "Câu hỏi mẫu"};
    $("#enout").innerHTML = props.length ? `<div class="panel"><div class="actions"><b>${props.length} dòng có đề xuất</b><span class="spacer"></span><label class="small"><input type="checkbox" id="markrev"> Đánh dấu đã duyệt</label><button class="btn primary" onclick="applyEnrich()">Lưu dòng đã chọn</button></div></div>` +
      props.map(p => `<div class="panel"><label style="display:flex;gap:10px;align-items:center;font-weight:500"><input type="checkbox" class="acc" value="${p.product_id}" checked>${esc(p.name)}</label>` +
        Object.entries(p.changes).map(([f, c]) => `<p class="small" style="margin:10px 0 0"><span class="muted">${FN[f] || f}</span><br>${c.new.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</p>`).join("") + `</div>`).join("")
      : `<div class="panel"><div class="empty"><b>Không có đề xuất mới.</b>Bật “Ghi đè” để tạo lại.</div></div>`;
  } catch (e) { $("#enout").innerHTML = `<div class="panel"><p class="msg err">${esc(e.message)}</p></div>`; }
}
window.applyEnrich = async () => { const ids = [...document.querySelectorAll(".acc:checked")].map(x => +x.value);
  try { const r = await req(`/v1/admin/demos/${encodeURIComponent(S.slug)}/enrich/${S.enrichJob}/apply`, {method: "POST", body: JSON.stringify({accept_product_ids: ids, mark_reviewed: $("#markrev").checked})});
    $("#enout").innerHTML = `<div class="panel"><p class="msg ok">Đã ghi ${r.applied} dòng.</p></div>`; if (r.embed_job) watchJob(r.embed_job); } catch (e) { alert(e.message); } };

// ---------- Nhật ký ----------
function viewLogs(){
  $("#view").innerHTML = `<div class="panel"><div class="actions"><h2 style="margin:0">Các câu gần đây</h2><span class="spacer"></span><label class="small"><input type="checkbox" id="wrongonly"> Chỉ phản hồi sai</label><button class="btn sm" id="reloadlogs">Tải lại</button></div>
    <div class="scroll" id="logout" style="margin-top:12px"></div></div>`;
  $("#reloadlogs").onclick = loadLogs; $("#wrongonly").onchange = loadLogs; loadLogs();
}
async function loadLogs(){
  try { const rows = await req(`/v1/admin/demos/${encodeURIComponent(S.slug)}/logs?limit=100&wrong_only=${$("#wrongonly").checked}`);
    $("#logout").innerHTML = rows.length ? `<table class="data"><tr><th>Lúc</th><th>Câu</th><th>Kết quả</th><th>ID dòng</th><th class="num">ms</th><th>Phản hồi</th></tr>` +
      rows.map(r => `<tr><td class="muted" style="white-space:nowrap">${esc(dt(r.created_at))}</td><td>${esc(r.text)}</td><td>${esc(VERDICT[r.status] || r.status)}${r.cache_hit ? ' <span class="muted">(cache)</span>' : ""}</td><td>${esc((r.product_ids || []).join(", "))}</td><td class="num">${r.latency?.total ? Math.round(r.latency.total) : ""}</td><td>${r.feedback ? (r.feedback.correct ? "đúng" : "sai" + (r.feedback.correct_product_id ? ", đúng là " + r.feedback.correct_product_id : "")) : ""}</td></tr>`).join("") + `</table>`
      : `<div class="empty"><b>Chưa có câu nào.</b>Các lượt tìm kiếm sẽ hiện ở đây.</div>`;
  } catch (e) { $("#logout").innerHTML = `<p class="msg err">${esc(e.message)}</p>`; }
}

// ---------- Cài đặt ----------
function viewSettings(){
  const t = T();
  $("#view").innerHTML = `<div class="panel"><h2>Tên bảng</h2><div class="actions" style="margin-top:10px"><input id="newname" aria-label="Tên bảng" value="${esc(t.name)}" style="max-width:360px"><button class="btn primary" id="rename">Đổi tên</button><span id="rnmsg" class="msg"></span></div>
      <p class="small muted" style="margin:8px 0 0">Mã bảng: <code>${esc(t.slug)}</code> (không thể đổi).</p></div>
    <div class="panel"><h2>Tạo lại vector</h2><p class="lede">Chỉ cập nhật dòng đã thay đổi.</p><button class="btn" id="reemb">Tạo lại vector</button></div>
    <div class="panel"><h2>Cấu trúc cột</h2><p class="lede">Cột tên: <b>${esc(t.name_column || "–")}</b></p>${t.columns.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>
    <div class="panel" style="border-color:color-mix(in srgb,var(--bad) 40%,var(--line))"><h2>Xoá bảng</h2><p class="lede">Xoá vĩnh viễn dữ liệu, khoá và nhật ký. Bot sẽ mất kết nối với bảng.</p><button class="btn danger" id="drop">Xoá bảng ${esc(t.name)}</button></div>`;
  $("#rename").onclick = async () => { const name = $("#newname").value.trim(); if (!name) return;
    try { await req(`/v1/admin/demos/${encodeURIComponent(t.slug)}`, {method: "PATCH", body: JSON.stringify({name})}); await loadTables(); renderTable(); } catch (e) { $("#rnmsg").className = "msg err"; $("#rnmsg").textContent = e.message; } };
  $("#reemb").onclick = async () => { try { const {job_id} = await req(`/v1/admin/demos/${encodeURIComponent(t.slug)}/embed`, {method: "POST"}); watchJob(job_id); } catch (e) { alert(e.message); } };
  $("#drop").onclick = async () => { const typed = prompt(`Gõ mã bảng “${t.slug}” để xác nhận xoá`); if (typed !== t.slug) return;
    try { await req(`/v1/admin/demos/${encodeURIComponent(t.slug)}`, {method: "DELETE"}); S.slug = null; go("#/"); } catch (e) { alert(e.message); } };
}

// ---------- tạo bảng mới ----------
let PLAN = null, FILE = null;
const CORE = [["name", "Cột tên", "bắt buộc"], ["sku", "Cột mã dòng", "dùng để cập nhật"], ["category", "Cột nhóm", ""], ["brand", "Cột hãng", ""], ["price", "Cột giá", ""]];
function renderNew(){
  PLAN = null; FILE = null; renderPicker(); renderNav();
  $("#main").innerHTML = `<div class="new-header"><h1>Tạo bảng mới</h1><p>Nhập dữ liệu từ Excel, CSV hoặc JSON.</p></div>
    <div class="panel"><div class="grid"><div class="field"><span>File dữ liệu</span><label class="file-pick">${icon('rows')}<span id="filename" class="file-name">Chọn Excel, CSV hoặc JSON</span><input type="file" id="nfile" aria-label="File dữ liệu" accept=".xlsx,.xls,.csv,.json,.jsonl"></label></div>
      <label class="field"><span>Tên bảng</span><input id="nname" placeholder="Ví dụ: Bảng giá gói cước"></label>
      <label class="field"><span>Mã bảng</span><input id="nslug" placeholder="Tự tạo từ tên file"></label></div>
      <div class="actions" style="margin-top:14px"><button class="btn primary" id="nprev">Đọc file</button><span id="nmsg" class="msg"></span></div></div><div id="nplan"></div>`;
  $("#nfile").onchange = () => { FILE = $("#nfile").files[0]; $('#filename').textContent = FILE ? FILE.name : 'Chọn Excel, CSV hoặc JSON'; if (FILE && !$("#nname").value) $("#nname").value = FILE.name.replace(/\.[^.]+$/, ""); if (FILE) readPlan(false); };
  $("#nprev").onclick = () => readPlan(false);
}
function newForm(withMap){ const fd = new FormData(); fd.append("file", FILE); if (withMap && PLAN) { const mp = {}; CORE.forEach(([k]) => { const v = $("#m_" + k)?.value; if (v) mp[k] = v; }); fd.append("mapping", JSON.stringify(mp)); } return fd; }
async function readPlan(withMap){ if (!FILE) { $("#nmsg").className = "msg err"; $("#nmsg").textContent = "Chọn file trước."; return; }
  $("#nmsg").className = "msg"; $("#nmsg").textContent = "Đang đọc file…";
  try { PLAN = await req("/v1/tables/preview", {method: "POST", body: newForm(withMap)}); $("#nmsg").textContent = ""; renderPlan(); } catch (e) { $("#nmsg").className = "msg err"; $("#nmsg").textContent = e.message; } }
function renderPlan(){ const p = PLAN, cols = p.columns; if (!$("#nslug").value) $("#nslug").placeholder = p.suggested_slug;
  const opt = sel => `<option value="">không có</option>` + cols.map(c => `<option ${c === sel ? "selected" : ""}>${esc(c)}</option>`).join("");
  $("#nplan").innerHTML = `<div class="panel"><h2>Chọn cột dữ liệu</h2><p class="lede">Kiểm tra cột đã chọn trước khi tạo bảng.</p>
      <div class="grid">${CORE.map(([k, lb, hint]) => `<label class="field"><span>${lb}${hint ? ` <span class="muted">(${hint})</span>` : ""}</span><select id="m_${k}">${opt(p.mapping[k])}</select></label>`).join("")}</div>
      <p class="small" style="margin:14px 0 4px">Thuộc tính tìm kiếm</p>${p.proposed_definitions.map(d => `<span class="chip">${esc(d.label)}: ${({number: "số", enum: "danh sách", multi_enum: "nhiều giá trị", bool: "có/không", text: "chữ"})[d.type] || d.type}${d.unit ? ", " + esc(d.unit) : ""}</span>`).join("") || '<span class="muted small">không có</span>'}
      ${p.warnings.length ? `<details style="margin-top:10px"><summary class="small" style="color:var(--warn);cursor:pointer">${p.warnings.length} cảnh báo khi đọc file</summary><pre>${esc(p.warnings.join("\n"))}</pre></details>` : ""}
      <div class="actions" style="margin-top:14px"><button class="btn" onclick="readPlan(true)">Cập nhật cột</button></div></div>
    <div class="panel"><h2>${fmtNum(p.n_rows)} dòng hợp lệ</h2><p class="lede">Xem trước 10 dòng đầu.</p>
      <div class="scroll"><table class="data"><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${p.preview.map(r => `<tr>${cols.map(c => `<td>${esc(r[c])}</td>`).join("")}</tr>`).join("")}</table></div>
      <div class="actions" style="margin-top:16px"><button class="btn primary" id="ncreate" ${p.n_rows ? "" : "disabled"}>Tạo bảng</button><span id="ncmsg" class="msg"></span></div></div>`;
  $("#ncreate").onclick = createTable;
}
async function createTable(){ const fd = newForm(true); fd.append("name", $("#nname").value.trim() || PLAN.suggested_slug); fd.append("slug", $("#nslug").value.trim() || PLAN.suggested_slug);
  $("#ncreate").disabled = true; $("#ncmsg").className = "msg"; $("#ncmsg").textContent = "Đang tạo bảng…";
  try { const r = await req("/v1/tables", {method: "POST", body: fd}); S.pendingJob = r.embed_job; await loadTables(); go(`#/t/${encodeURIComponent(r.slug)}/api`); }
  catch (e) { $("#ncreate").disabled = false; $("#ncmsg").className = "msg err"; $("#ncmsg").textContent = e.message; } }

// ---------- đăng nhập / khởi động ----------
function showLogin(){ setSecretVisibility("loginPass", false); clearKeySecrets(); $("#authgate").classList.add("show"); setTimeout(() => $("#loginEmail").focus(), 50); }
function hideLogin(){ setSecretVisibility("loginPass", false); $("#authgate").classList.remove("show"); }
$("#authform").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#loginEmail").value.trim(), password = $("#loginPass").value, remember = $("#loginRemember").checked;
  const btn = $("#loginBtn"); btn.disabled = true; $("#loginErr").textContent = "";
  try {
    const r = await fetch("/v1/auth/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({email, password, remember})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "Đăng nhập thất bại");
    saveAuth(j.token, remember); AUTH.account = j.account; $("#loginPass").value = "";
    hideLogin(); renderAccount(); route();
  } catch (err) { $("#loginErr").textContent = err.message; }
  finally { btn.disabled = false; }
});
window.doLogout = async () => {
  resetSecretMasks(); clearKeySecrets(); closeConnection();
  try { await req("/v1/auth/logout", {method: "POST"}); } catch {}
  clearAuth(); renderAccount(); location.hash = ""; boot();
};
function renderAccount(){
  const box = $("#acctbox"); if (!box) return;
  if (AUTH.account) {
    const em = AUTH.account.email || "", nm = AUTH.account.name || em;
    box.innerHTML = `<div class="acctchip"><span class="av">${esc((nm[0] || "?").toUpperCase())}</span><span class="em"><b>${esc(nm)}</b>${esc(em)}</span></div>
      ${AUTH.account.is_admin ? `<button class="btn ghost sm" style="width:100%;justify-content:flex-start" onclick="openAccounts()">Quản lý tài khoản</button>` : ""}
      <button class="btn ghost sm" style="width:100%;justify-content:flex-start" onclick="doLogout()">Đăng xuất</button>`;
  } else box.innerHTML = "";
}
window.openAccounts = async () => { closeConnection(); $("#acctmodal").classList.add("show"); $("#acctmsg").textContent = ""; await loadAccounts(); };
window.closeAccounts = () => $("#acctmodal").classList.remove("show");
async function loadAccounts(){
  try {
    const list = await req("/v1/admin/accounts");
    const meId = AUTH.account && AUTH.account.id;
    $("#acctlist").innerHTML = `<table class="data"><tr><th>Email</th><th>Tên</th><th>SĐT</th><th>Quyền</th><th>Trạng thái</th><th class="num">Bảng</th><th></th></tr>` +
      list.map(a => `<tr><td><b>${esc(a.email)}</b>${a.id === meId ? ' <span class="muted">(bạn)</span>' : ""}</td><td>${esc(a.name || "–")}</td><td>${esc(a.phone || "–")}</td>
        <td>${a.is_admin ? '<span class="badge ad">Quản trị</span>' : '<span class="muted">Thường</span>'}</td>
        <td>${a.active ? "Hoạt động" : '<span class="badge off">Đã khoá</span>'}</td><td class="num">${a.n_tables}</td>
        <td style="white-space:nowrap">
          <button class="btn ghost sm" onclick='editAccount(${a.id})'>Sửa</button>
          <button class="btn ghost sm" onclick='resetPass(${a.id},"${esc(a.email)}")'>Đổi MK</button>
          ${a.id === meId ? "" : `<button class="btn ghost sm" onclick='toggleActive(${a.id},${!a.active})'>${a.active ? "Khoá" : "Mở"}</button>
          <button class="btn ghost sm" style="color:var(--bad)" onclick='delAccount(${a.id},"${esc(a.email)}")'>Xoá</button>`}
        </td></tr>`).join("") + `</table></div>`;
    $("#acctcreate").innerHTML = `<h3>Thêm tài khoản</h3>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        <label class="field"><span>Email</span><input id="naEmail" type="email" placeholder="user@congty.com"></label>
        <label class="field"><span>Mật khẩu</span><input id="naPass" type="text" placeholder="≥ 6 ký tự"></label>
        <label class="field"><span>Tên</span><input id="naName" placeholder="Họ tên"></label>
        <label class="field"><span>SĐT</span><input id="naPhone" placeholder="(tuỳ chọn)"></label></div>
      <div class="actions" style="margin-top:12px"><label style="display:flex;gap:7px;align-items:center;font-size:14px"><input type="checkbox" id="naAdmin"> Quyền quản trị</label>
        <span class="spacer"></span><button class="btn primary" onclick="createAccount()">Tạo tài khoản</button></div>`;
  } catch (e) { $("#acctlist").innerHTML = `<p class="msg err">${esc(e.message)}</p>`; }
}
window.createAccount = async () => {
  const body = {email: $("#naEmail").value.trim(), password: $("#naPass").value, name: $("#naName").value.trim() || null,
                phone: $("#naPhone").value.trim() || null, is_admin: $("#naAdmin").checked};
  if (!body.email || body.password.length < 6) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = "Nhập email và mật khẩu ≥ 6 ký tự."; return; }
  try { await req("/v1/admin/accounts", {method: "POST", body: JSON.stringify(body)}); $("#acctmsg").className = "msg ok"; $("#acctmsg").textContent = "Đã tạo " + body.email; await loadAccounts(); }
  catch (e) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = e.message; }
};
window.editAccount = async id => {
  const name = prompt("Tên hiển thị (để trống = giữ nguyên):"); if (name === null) return;
  const phone = prompt("Số điện thoại (để trống = giữ nguyên):"); if (phone === null) return;
  const data = {}; if (name.trim()) data.name = name.trim(); if (phone.trim()) data.phone = phone.trim();
  if (!Object.keys(data).length) return;
  try { await req(`/v1/admin/accounts/${id}`, {method: "PATCH", body: JSON.stringify(data)}); await loadAccounts(); } catch (e) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = e.message; }
};
window.resetPass = async (id, email) => {
  const pw = prompt(`Mật khẩu mới cho ${email} (≥ 6 ký tự):`); if (!pw) return;
  if (pw.length < 6) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = "Mật khẩu phải ≥ 6 ký tự."; return; }
  try { await req(`/v1/admin/accounts/${id}`, {method: "PATCH", body: JSON.stringify({password: pw})}); $("#acctmsg").className = "msg ok"; $("#acctmsg").textContent = "Đã đổi mật khẩu."; } catch (e) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = e.message; }
};
window.toggleActive = async (id, active) => {
  try { await req(`/v1/admin/accounts/${id}`, {method: "PATCH", body: JSON.stringify({active})}); await loadAccounts(); } catch (e) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = e.message; }
};
window.delAccount = async (id, email) => {
  if (!confirm(`Xoá tài khoản ${email}? Bảng của họ sẽ không còn chủ.`)) return;
  try { await req(`/v1/admin/accounts/${id}`, {method: "DELETE"}); await loadAccounts(); } catch (e) { $("#acctmsg").className = "msg err"; $("#acctmsg").textContent = e.message; }
};
async function boot(){
  try {
    const r = await fetch("/v1/auth/me", {headers: AUTH.token ? {Authorization: "Bearer " + AUTH.token} : {}});
    if (r.status === 401) { showLogin(); return; }
    const j = await r.json(); AUTH.account = j.account || null;
  } catch { /* server lỗi -> vẫn thử vào app */ }
  hideLogin(); renderAccount(); route();
}
boot();
</script>
</body>
</html>
